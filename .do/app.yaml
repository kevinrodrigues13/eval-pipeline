# DigitalOcean App Platform spec for the live-judge evaluation service.
# Needs ANTHROPIC_API_KEY and LIVE_JUDGE_API_KEY set as App Platform
# secrets (not committed here) for live mode to be reachable at all.
# Deploy with: doctl apps create --spec .do/app.yaml
# (Not deployed as part of this submission — see DEPLOYMENT.md.)
name: eval-pipeline-service
services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 5
      period_seconds: 10
    routes:
      - path: /
